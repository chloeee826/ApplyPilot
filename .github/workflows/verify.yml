name: Verify portfolio MVP
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: applypilot_test
          POSTGRES_USER: applypilot
          POSTGRES_PASSWORD: test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U applypilot -d applypilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install -r backend/requirements.txt
      - run: .venv/bin/python -m pytest -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://applypilot:test_only@127.0.0.1:5432/applypilot_test
          RUN_POSTGRES_TESTS: '1'
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run lint
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failure
          path: frontend/test-results
